<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="css/style.css">
    <title>Курсовой проект БД</title>
    <script src="js/app.js" type="module"></script>
  </head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="header__title">АИС Отдела кадров</div>
    </header>

      <div class="container">
        <main class="main">
          <div class="title">
            <h1 class="title__hero">Курсовой проект АСУбз23-1 Николаев ВА</h1>
          </div>
          <div class="subtitle">
            <h2>Список отделов</h2>
          </div>

          <div>
            <table class="table" data-table >
              <tr>
                <td>Номер отдела</td>
                <td>Отдел</td>
                <td>Действие</td>
                <td>Действие</td>
              </tr>
              <tr data-item>
                <td data-id>2</td>
                <td><input data-name-office="Отдел А" name="updateoffice" value="Отдел А"></td>
                <td><button class="button-small update" data-update>Обновить</button></td>
                <td><button class="button-small delete" data-delete>Удалить</button></td>
              </tr>
              <tr data-item>
                <td data-id>3</td>
                <td><input data-name-office="Отдел B" type="text" value="Отдел B"></td>
                <td><button class="button-small update" data-update>Обновить</button></td>
                <td><button class="button-small delete" data-delete>Удалить</button></td>
              </tr>

              <tr data-item>
                <td></td>
                <td><input data-name-office type="text" name="nameoffice" placeholder="Отдел"></td>
                <td> </td>
                <td><button class="button-small add" data-add>Добавить</button></td>
              </tr>
            </table>
            <br>
          </div>

          <div class="flex-between">
            <div class="flex-between">
              <button onclick="window.location.href='index.html'">выйти</button>
            </div>
          </div>
          <br>
          <div class="error"></div>
        </main>
      </div>

        <footer class="footer">
          &copy; Николаев Вадим Александрович АСУбз-23-1
          <script src="js/app_menu.js"></script>
        </footer>


  </div>


</body>
</html>
