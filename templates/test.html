{% extends 'base.html' %}

{% block content %}

<h1>TITLE</h1>

{% for joke in jokes %}
<nav class="nav-menu">
  <ul>
    <li>
      <a href="{{ url_for('index') }}">Главная</a>
    </li>
    <li>
      <a href="{{ url_for('create') }}">Добавить</a>
    </li>
  </ul>
</nav>

<div class="joke">
  <h3># {{ joke[0] }} - {{ joke[1] by {{ joke[2] }}</h3>
  <p class="joketext">{{ joke[3] }}</p>
  <p>
    <i>Добавлен {{ joke[4] }}</i>
  </p>
</div>

{% endfor %}

{% endblock %}
