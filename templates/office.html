<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="курсовой проект, проектирование АИС отдела кадров">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico')}}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
    <script src="{{ url_for('static', filename='js/app.js')}}" type="module"></script>
    <title>Курсовой проект БД</title>
  </head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="logo"><img class="logo__img" src="{{ url_for('static', filename='img/logo_hr.png')}}" alt="logo"></div>
      <div class="header__title">АИС Отдела кадров</div>
    </header> 

      <div class="container">
        <main class="main">
          <div class="back-out">
            <button onclick="window.location.href='/menu1'"  class="button-small">&larr; назад</button>
            <div class="error">{{ message }}</div>
            <button onclick="window.location.href='/'"  class="button-small">выйти</button>
          </div>

          <div class="title">
            <h1 class="title__hero">Курсовой проект АСУбз23-1 Николаев ВА</h1>
          </div>

          <div class="subtitle">
            <h2>Список отделов</h2>
          </div>          

          <div>
            <table data-table class="table">
              <tr>
                <td class="text-center">Номер отдела</td>
                <td class="text-center">Отдел</td>
                <td class="text-center" colspan="2">Действие</td>
              </tr>
              <tr data-item class="add-item">
                <td></td>
                <td><input data-office-name type="text" name="nameoffice" placeholder="Отдел"></td>
                <td colspan="2"><button class="button-small event-add" data-add>Добавить</button></td>
              </tr>
              {% for office in offices %}
               <tr data-item>
                <td        data-office-number>{{ office[0] }}</td>
                <td><input data-office-name="{{ office[1] }}" type="text" value="{{ office[1] }}"></td>
                <td><button class="button-small update" data-update>Обновить</button></td>
                <td><button class="button-small delete" data-delete>Удалить</button></td>
              </tr>
              {% endfor %}
            </table>
            <br>
          </div>

          <br>
          <div class="error"></div>
        </main>
      </div>

        <footer class="footer">
          <div class="footer__copy">>&copy; Николаев Вадим Александрович АСУбз-23-1</div>
          <script src="{{ url_for('static', filename='js/app_office.js')}}" type="module"></script>
        </footer>

  </div>
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <p>Вы уверены, что хотите продолжить?</p>
      <br><br>
      <button id="confirmBtn">ОК</button>
      <br><br>
      <button id="cancelBtn">Отмена</button>
    </div>
  </div>

</body>
</html>
